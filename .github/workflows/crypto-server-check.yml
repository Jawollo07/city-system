name: Crypto server checks

on:
  pull_request:
    paths:
      - "crypto-server/**"
      - ".github/workflows/crypto-server-check.yml"
  push:
    branches:
      - main
    paths:
      - "crypto-server/**"

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r crypto-server/requirements.txt
      - name: Compile Python source
        run: python -m py_compile crypto-server/app.py
